name: Bug report
description: Report a reproducible defect in the engine.
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: engine_version
    attributes:
      label: Engine version or commit
      placeholder: v0.1.0 or full commit SHA
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: output of node --version
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, macOS 15, Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use fictional content only. Do not paste private notes or secrets.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact tokens, private paths and personal content.
    validations:
      required: false
