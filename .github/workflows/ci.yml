name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SITE_URL: https://example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Unit and publication boundary tests
        run: npm test
      - name: Validate example content
        run: npm run content:validate -- --source examples/content
      - name: Build public example
        run: npm run build:example
      - name: Check internal links
        run: npm run check:links
      - name: Audit public artifact
        run: npm run artifact:audit
