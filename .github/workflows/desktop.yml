name: Desktop

on:
  push:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - 'components/editor/**'
      - 'lib/project/**'
      - 'app/editor/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'components/editor/**'
      - 'lib/project/**'
      - 'app/editor/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Desktop filesystem tests
        run: npm run desktop:test
      - name: Build Windows installer
        run: npm run desktop:build
      - uses: actions/upload-artifact@v7
        with:
          name: rhizomaybor-windows-installer
          path: src-tauri/target/release/bundle/nsis/*
          if-no-files-found: error
